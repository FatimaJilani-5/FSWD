<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | MAISON BEAUTY</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    :root {
      --maison-nude: #f9f5f0;
      --maison-dark: #1a1817;
      --maison-rose: #e8d8ce;
    }

    body {
      background-color: var(--maison-nude);
      color: var(--maison-dark);
    }

    .checkout-box {
      background-color: white;
      padding: 30px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }

    .payment-option {
      border: 1px solid #ddd;
      padding: 15px;
    }

    .btn-beauty-dark {
      background-color: var(--maison-dark);
      color: white;
      border: 1px solid var(--maison-dark);
      border-radius: 2px;
    }

    .btn-beauty-dark:hover {
      background-color: #332f2d;
      color: white;
    }
  </style>
</head>

<body>

<nav class="navbar bg-white shadow-sm border-bottom">

  <div class="container py-3">

    <a class="navbar-brand fw-bold fs-3" href="index.html" style="letter-spacing: 2px;">
      MAISON <span class="fw-light fs-5">BEAUTY</span>
    </a>

    <span class="text-secondary">
      Secure Checkout
    </span>

  </div>

</nav>


<section class="container py-5">

  <div class="mb-5">

    <span class="badge bg-dark px-3 py-2 mb-3">
      CHECKOUT
    </span>

    <h1 class="display-5 fw-bold">
      Complete your order
    </h1>

  </div>


  <div class="row g-5">

    <div class="col-lg-7">

      <div class="checkout-box">

        <h4 class="fw-bold mb-4">
          Contact Information
        </h4>

        <div class="mb-4">

          <label class="form-label fw-semibold">
            Email Address
          </label>

          <input
            type="email"
            class="form-control"
            placeholder="you@example.com"
          >

        </div>


        <h4 class="fw-bold mb-4">
          Shipping Address
        </h4>

        <div class="row g-3">

          <div class="col-md-6">

            <label class="form-label">
              First Name
            </label>

            <input type="text" class="form-control">

          </div>

          <div class="col-md-6">

            <label class="form-label">
              Last Name
            </label>

            <input type="text" class="form-control">

          </div>

          <div class="col-12">

            <label class="form-label">
              Address
            </label>

            <input type="text" class="form-control">

          </div>

          <div class="col-md-6">

            <label class="form-label">
              City
            </label>

            <input type="text" class="form-control">

          </div>

          <div class="col-md-6">

            <label class="form-label">
              Postal Code
            </label>

            <input type="text" class="form-control">

          </div>

        </div>


        <h4 class="fw-bold mt-5 mb-4">
          Payment
        </h4>


        <div class="payment-option mb-3">

          <div class="form-check">

            <input
              class="form-check-input"
              type="radio"
              name="payment"
              id="card"
              checked
            >

            <label class="form-check-label fw-semibold" for="card">
              Credit / Debit Card
            </label>

          </div>

        </div>


        <div class="payment-option mb-3">

          <div class="form-check">

            <input
              class="form-check-input"
              type="radio"
              name="payment"
              id="cash"
            >

            <label class="form-check-label fw-semibold" for="cash">
              Cash on Delivery
            </label>

          </div>

        </div>


        <div class="row g-3 mt-2">

          <div class="col-12">

            <label class="form-label">
              Card Number
            </label>

            <input
              type="text"
              class="form-control"
              placeholder="1234 5678 9012 3456"
            >

          </div>

          <div class="col-md-6">

            <label class="form-label">
              Expiry Date
            </label>

            <input
              type="text"
              class="form-control"
              placeholder="MM / YY"
            >

          </div>

          <div class="col-md-6">

            <label class="form-label">
              CVV
            </label>

            <input
              type="text"
              class="form-control"
              placeholder="123"
            >

          </div>

        </div>

      </div>

    </div>


    <div class="col-lg-5">

      <div class="checkout-box">

        <h4 class="fw-bold mb-4">
          Your Order
        </h4>


        <div class="d-flex justify-content-between mb-3">

          <div>
            <strong>Hydrating Velvet Lip Oil</strong>
            <small class="d-block text-secondary">Qty: 1</small>
          </div>

          <strong>$26.00</strong>

        </div>


        <div class="d-flex justify-content-between mb-3">

          <div>
            <strong>Luminous Silk Tint</strong>
            <small class="d-block text-secondary">Qty: 1</small>
          </div>

          <strong>$42.00</strong>

        </div>


        <hr>


        <div class="d-flex justify-content-between mb-3">

          <span class="text-secondary">
            Subtotal
          </span>

          <strong>
            $68.00
          </strong>

        </div>


        <div class="d-flex justify-content-between mb-3">

          <span class="text-secondary">
            Shipping
          </span>

          <strong>
            Free
          </strong>

        </div>


        <hr>


        <div class="d-flex justify-content-between mb-4">

          <strong class="fs-5">
            Total
          </strong>

          <strong class="fs-4">
            $68.00
          </strong>

        </div>


        <button class="btn btn-beauty-dark w-100 py-3">
          Place Order
        </button>

      </div>

    </div>

  </div>

</section>

</body>
</html>

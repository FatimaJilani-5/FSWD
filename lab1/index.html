<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f6f3f4;
        }

        .calculator {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cccccc;
        }

        .calculator > h2 {
            text-align: center;
            color: #7a4b67;
        }

        .display {
            width: 100%;
            height: 55px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 24px;
            text-align: right;
            border: 2px solid #ead3df;
            border-radius: 8px;
            background-color: #fff7fb;
            box-sizing: border-box;
        }

        .display + .buttons {
            margin-top: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .buttons > button {
            height: 50px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #f4e4ec;
            cursor: pointer;
        }

        .buttons > button:hover {
            background-color: #e9cbd9;
        }

        .operator {
            background-color: #d9b6c8;
        }

        .clear {
            background-color: #f3b7bd;
        }

        .equal {
            background-color: #7a4b67;
            color: white;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Calculator</h2>

        <input type="text" class="display" value="0" readonly>

        <div class="buttons">

            <button class="clear">C</button>
            <button class="operator">÷</button>
            <button class="operator">×</button>
            <button class="operator">−</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">+</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>.</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="equal">=</button>

            <button>0</button>

        </div>

    </div>

</body>
</html>

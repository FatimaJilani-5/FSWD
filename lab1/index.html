<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .calculator {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
        }

        .display {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            font-size: 25px;
            text-align: right;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .buttons > button {
            height: 50px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .buttons > button + button {
           
        }

        .operator {
            background-color: #ddd;
        }

        .equal {
            background-color: #333;
            color: white;
        }

        .clear {
            background-color: #ffdddd;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" class="display" value="0" readonly>

        <div class="buttons">

            <button class="clear">C</button>
            <button class="operator">÷</button>
            <button class="operator">×</button>
            <button class="operator">−</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">+</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>0</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="equal">=</button>

        </div>

    </div>

</body>
</html>
